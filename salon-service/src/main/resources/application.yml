server:
  port: 5002
spring:
  application:
    name: salon-service
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:mysql://localhost:3306/salon_servicedb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: admin@12345@111


eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/


spring.jpa.show-sql: true
